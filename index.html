<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- iOS 主屏幕全屏模式 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="车机桌面">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>车机桌面</title>
<style>
  :root {
    --bg: #0a0c10;
    --card: #15181f;
    --card-hi: #1c2029;
    --accent: #ff9f0a;
    --accent2: #ffd60a;
    --text: #f2f4f8;
    --text-dim: #8a90a0;
    --tile-radius: 22px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", sans-serif;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 竖屏时提示旋转 */
  #rotate-hint {
    display: none;
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 99;
    flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px; font-size: 18px; color: var(--text-dim);
  }
  @media (orientation: portrait) {
    #rotate-hint { display: flex; }
    #app { display: none; }
  }
  #rotate-hint .phone { font-size: 64px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }

  #app {
    display: flex;
    height: 100vh;
    padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 18px)
             calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 18px);
    gap: 20px;
  }

  /* ===== 左侧：时钟 / 仪表区 ===== */
  #left {
    flex: 1.1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    min-width: 0;
  }
  #clock {
    font-size: clamp(64px, 16vh, 110px);
    font-weight: 200;
    letter-spacing: 2px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    display: flex; align-items: baseline;
  }
  #clock .sec {
    font-size: 0.32em;
    color: var(--accent);
    margin-left: 12px;
    font-weight: 400;
  }
  #date { font-size: clamp(16px, 3.6vh, 22px); color: var(--text-dim); }
  #date b { color: var(--text); font-weight: 600; margin-right: 10px; }

  /* 天气卡片 */
  #weather {
    margin-top: 8px;
    background: var(--card);
    border-radius: var(--tile-radius);
    padding: 14px 18px;
    display: flex; align-items: center; gap: 14px;
    max-width: 420px;
  }
  #weather .w-icon { font-size: 40px; line-height: 1; }
  #weather .w-temp { font-size: 34px; font-weight: 600; }
  #weather .w-temp span { font-size: 18px; color: var(--text-dim); }
  #weather .w-desc { font-size: 15px; color: var(--text-dim); line-height: 1.5; }
  #weather.loading .w-desc { color: var(--accent); }

  /* 底部状态栏：充电提示 */
  #status {
    margin-top: 4px;
    font-size: 13px;
    color: var(--text-dim);
    display: flex; align-items: center; gap: 6px;
  }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; }

  /* ===== 右侧：应用磁贴 ===== */
  #tiles {
    flex: 1.6;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
  }
  .tile {
    background: var(--card);
    border-radius: var(--tile-radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    transition: transform .08s, background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:active { transform: scale(.95); background: var(--card-hi); }
  .tile .t-icon { font-size: clamp(30px, 8vh, 44px); line-height: 1; }
  .tile .t-label { font-size: 15px; font-weight: 500; color: var(--text); }
  .tile .t-sub { font-size: 11px; color: var(--text-dim); margin-top: -6px; }

  /* 音乐磁贴特殊高亮 */
  .tile.music { background: linear-gradient(150deg, #2a1f0e, #1a1510); }
  .tile.music:active { background: linear-gradient(150deg, #3a2c12, #241d14); }
  .tile.music .t-icon { color: var(--accent); }

  /* 通用小按钮（工具行） */
  #quickrow {
    display: flex; gap: 10px;
    margin-top: 6px;
  }
  .qbtn {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--card);
    border: none;
    color: var(--text-dim);
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .qbtn:active { background: var(--card-hi); }
  .qbtn.on { color: var(--accent); }

  /* Toast 提示 */
  #toast {
    position: fixed;
    left: 50%; bottom: 12%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(40,44,54,.95);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .25s, transform .25s;
    pointer-events: none;
    z-index: 100;
    max-width: 80%;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="phone">📱</div>
  <div>请横置手机进入车机模式</div>
</div>

<div id="app">
  <!-- 左侧 仪表区 -->
  <div id="left">
    <div id="clock"><span id="hm">--:--</span><span class="sec" id="sec">--</span></div>
    <div id="date"><b id="md">--月--日</b><span id="week">星期--</span></div>
    <div id="weather" class="loading">
      <div class="w-icon" id="w-icon">⏳</div>
      <div>
        <div class="w-temp"><span id="w-temp">--</span><span>°C</span></div>
        <div class="w-desc" id="w-desc">正在获取天气…</div>
      </div>
    </div>
    <div id="status"><span class="dot"></span><span id="status-text">车机模式运行中</span></div>
    <div id="quickrow">
      <button class="qbtn" id="light-btn" onclick="toggleLight()" title="夜间/日间">🌙</button>
      <button class="qbtn on" id="wake-btn" onclick="toggleWake()" title="屏幕常亮">☀️</button>
    </div>
  </div>

  <!-- 右侧 磁贴区 -->
  <div id="tiles">
    <div class="tile" onclick="openApp('amap')">
      <div class="t-icon">🧭</div>
      <div class="t-label">高德地图</div>
      <div class="t-sub">导航</div>
    </div>
    <div class="tile" onclick="openApp('bmap')">
      <div class="t-icon">🗺️</div>
      <div class="t-label">百度地图</div>
      <div class="t-sub">导航</div>
    </div>
    <div class="tile music" onclick="openApp('qishui')">
      <div class="t-icon">🎵</div>
      <div class="t-label">汽水音乐</div>
      <div class="t-sub">播放音乐</div>
    </div>
    <!-- 汽水音乐无公开 scheme，通过「快捷指令」打开，见 README -->
    <div class="tile" onclick="openApp('waze')">
      <div class="t-icon">🚗</div>
      <div class="t-label">Waze</div>
      <div class="t-sub">路况导航</div>
    </div>
    <div class="tile" onclick="openApp('shortcuts')">
      <div class="t-icon">⚡️</div>
      <div class="t-label">快捷指令</div>
      <div class="t-sub">自动化</div>
    </div>
    <div class="tile" onclick="toggleFull('settings')">
      <div class="t-icon">⚙️</div>
      <div class="t-label">设置</div>
      <div class="t-sub">系统</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- 静音视频：防止屏幕休眠（iOS Wake Lock 的替代方案） -->
<video id="nosleep" muted playsinline loop
  style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"
  src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDE="></video>

<script>
/* ================= 配置（可修改） ================= */
const CONFIG = {
  // 天气备用城市坐标 [纬度, 经度, 城市名]（获取定位失败时使用）
  fallbackLocation: [39.9042, 116.4074, "北京"],
  // 是否需要 HTTPS 定位（file:// 或 http 下可能失败，会自动用备用城市）
  useGeolocation: true
};

/* ================= App 打开方式 ================= */
// iOS URL Scheme，未安装则回落到网页版
const APPS = {
  amap:  { scheme: "iosamap://",          web: "https://ditu.amap.com/" },
  bmap:  { scheme: "baidumap://",         web: "https://map.baidu.com/" },
  waze:  { scheme: "waze://",             web: "https://www.waze.com/ul" },
  // 汽水音乐无公开 scheme，通过「快捷指令」App 打开（需先创建名为 Qishui 的快捷指令）
  qishui: { scheme: "shortcuts://run-shortcut?name=Qishui", web: null,
            miss: "未运行？请先在「快捷指令」App 新建名为 Qishui\n的快捷指令（操作=打开App→汽水音乐）" },
  shortcuts: { scheme: "shortcuts://", web: null }
};

let lastOpened = null;
function openApp(key) {
  const app = APPS[key];
  if (!app) return;
  lastOpened = { key, t: Date.now() };
  const start = Date.now();
  window.location.href = app.scheme;
  // 1.5 秒后如果还停留在页面，说明 App 未安装/跳转失败
  setTimeout(() => {
    if (Date.now() - start >= 1400 && document.visibilityState === "visible") {
      if (app.web) {
        window.location.href = app.web;
      } else if (app.miss) {
        showToast(app.miss);
      }
    }
  }, 1500);
}

/* ================= 时钟 ================= */
const WEEKS = ["日","一","二","三","四","五","六"];
function tick() {
  const n = new Date();
  const p = v => String(v).padStart(2, "0");
  document.getElementById("hm").textContent = p(n.getHours()) + ":" + p(n.getMinutes());
  document.getElementById("sec").textContent = p(n.getSeconds());
  document.getElementById("md").textContent = (n.getMonth()+1) + "月" + n.getDate() + "日";
  document.getElementById("week").textContent = "星期" + WEEKS[n.getDay()];
}
tick();
setInterval(tick, 1000);

/* ================= 天气（Open-Meteo，免 API Key） ================= */
const WMO = {
  0:["晴","☀️"],1:["多云转晴","🌤️"],2:["多云","⛅"],3:["阴","☁️"],
  45:["雾","🌫️"],48:["雾凇","🌫️"],
  51:["小毛毛雨","🌦️"],53:["毛毛雨","🌦️"],55:["大毛毛雨","🌧️"],
  61:["小雨","🌦️"],63:["中雨","🌧️"],65:["大雨","🌧️"],
  71:["小雪","🌨️"],73:["中雪","🌨️"],75:["大雪","❄️"],77:["雪粒","🌨️"],
  80:["阵雨","🌦️"],81:["强阵雨","🌧️"],82:["暴雨","⛈️"],
  85:["阵雪","🌨️"],86:["强阵雪","❄️"],
  95:["雷阵雨","⛈️"],96:["雷雨伴冰雹","⛈️"],99:["强雷雨冰雹","⛈️"]
};
function loadWeather() {
  const done = (lat, lon, city) => {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&timezone=auto`;
    fetch(url).then(r => r.json()).then(d => {
      const cw = d.current_weather;
      const [desc, icon] = WMO[cw.weathercode] || ["未知", "🌡️"];
      document.getElementById("weather").classList.remove("loading");
      document.getElementById("w-icon").textContent = icon;
      document.getElementById("w-temp").textContent = Math.round(cw.temperature);
      document.getElementById("w-desc").innerHTML =
        desc + " · 风速 " + Math.round(cw.windspeed) + " km/h" +
        (city ? "<br>" + city : "");
    }).catch(() => {
      document.getElementById("weather").classList.remove("loading");
      document.getElementById("w-icon").textContent = "⚠️";
      document.getElementById("w-desc").textContent = "天气获取失败（需联网）";
    });
  };
  if (CONFIG.useGeolocation && navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => done(pos.coords.latitude, pos.coords.longitude, ""),
      () => done(...CONFIG.fallbackLocation, CONFIG.fallbackLocation[2]),
      { timeout: 5000, maximumAge: 600000 }
    );
  } else {
    done(...CONFIG.fallbackLocation, CONFIG.fallbackLocation[2]);
  }
}
loadWeather();
setInterval(loadWeather, 30 * 60 * 1000); // 每30分钟刷新

/* ================= 屏幕常亮（静音视频循环 hack） ================= */
const nosleep = document.getElementById("nosleep");
let wakeOn = true;
function startWake() {
  // 载入一段真实的最小 mp4 以循环播放，让 Safari 认为在播视频，从而不锁屏
  nosleep.play().catch(() => {});
}
function toggleWake() {
  wakeOn = !wakeOn;
  document.getElementById("wake-btn").classList.toggle("on", wakeOn);
  if (wakeOn) { startWake(); showToast("屏幕常亮：开"); }
  else { nosleep.pause(); showToast("屏幕常亮：关"); }
}
document.addEventListener("touchstart", function once() {
  if (wakeOn) startWake();
  document.removeEventListener("touchstart", once);
});

/* ================= 日间/夜间模式 ================= */
let light = false;
function toggleLight() {
  light = !light;
  document.getElementById("light-btn").textContent = light ? "☀️" : "🌙";
  document.documentElement.style.setProperty("--bg", light ? "#e8eaef" : "#0a0c10");
  document.documentElement.style.setProperty("--card", light ? "#ffffff" : "#15181f");
  document.documentElement.style.setProperty("--card-hi", light ? "#dfe2e8" : "#1c2029");
  document.documentElement.style.setProperty("--text", light ? "#1a1c22" : "#f2f4f8");
  document.documentElement.style.setProperty("--text-dim", light ? "#6a7080" : "#8a90a0");
}

/* ================= Toast ================= */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

/* ================= 设置磁贴：跳系统设置 ================= */
function toggleFull(key) {
  if (key === "settings") {
    // iOS 不允许网页跳系统设置，提示用户手动操作
    showToast("iOS 限制：请按 Home 键退出后\n在桌面打开「设置」");
  }
}
</script>
</body>
</html>
